<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5e1a24">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cantor Cristão Cifrado</title>
<style>
:root{
  --bg:#f5efe3; --surface:#fbf7ef; --ink:#2b2420; --muted:#7a6d62; --line:#e2d7c4;
  --wine:#5e1a24; --wine-ink:#fbf7ef; --chord:#9b2d1f; --gold:#a8834a;
  --fs:19px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#191514; --surface:#221d1b; --ink:#ece3d3; --muted:#a6998b; --line:#3a312c;
    --wine:#3d1218; --wine-ink:#f3e8d6; --chord:#e9a26a; --gold:#c9a46a; color-scheme:dark; }
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--wine);color:var(--wine-ink);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand h1{margin:0;font-size:24px;font-weight:600;letter-spacing:.02em;font-variant:small-caps}
.brand span{font-size:14px;opacity:.75;font-style:italic}
.search{display:flex;align-items:center;background:rgba(255,255,255,.12);border-radius:10px;padding:0 12px;
  border:1px solid rgba(255,255,255,.18)}
.search input{flex:1;border:0;background:transparent;color:var(--wine-ink);font:inherit;font-size:18px;padding:12px 4px;outline:none;min-width:0}
.search input::placeholder{color:var(--wine-ink);opacity:.6}
.clear{border:0;background:none;font-size:22px;padding:4px 6px;opacity:.7;cursor:pointer}
main{max-width:720px;margin:0 auto}
.list{list-style:none;margin:0;padding:6px 0 40px}
.list li a{display:flex;gap:14px;align-items:baseline;padding:13px 18px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.list li a:active{background:var(--surface)}
.num{font-variant-numeric:tabular-nums lining-nums;color:var(--gold);font-weight:600;min-width:2.6em;text-align:right;font-size:17px}
.tt{display:block;font-size:19px}
.fl{display:block;font-size:14px;color:var(--muted);font-style:italic;margin-top:2px}
.sec{padding:14px 18px 4px;color:var(--muted);font-size:14px;font-style:italic}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.hbar{position:sticky;top:0;z-index:5;background:var(--wine);color:var(--wine-ink);
  padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;display:flex;align-items:center;gap:4px}
.ib{border:0;background:none;color:var(--wine-ink);min-width:44px;height:44px;border-radius:10px;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.ib:active{background:rgba(255,255,255,.15)}
.hbar .sp{flex:1}
.head{padding:22px 20px 6px}
.head .n{color:var(--gold);font-size:42px;line-height:1;font-weight:600;font-variant-numeric:lining-nums}
.head h2{margin:6px 0 10px;font-size:30px;line-height:1.15;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.cred{margin:8px 0 0;font-size:13px;color:var(--muted);font-style:italic;line-height:1.5}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px 4px}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px;font-size:15px}
.chip button{border:0;background:none;min-width:40px;height:36px;border-radius:999px;cursor:pointer;font-size:16px}
.chip button:active{background:var(--line)}
.chip .lbl{padding:0 6px;color:var(--muted);font-family:system-ui,sans-serif;font-size:14px;white-space:nowrap}
.chip .lbl b{color:var(--chord)}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;height:42px;font-size:15px;cursor:pointer;font-family:system-ui,sans-serif}
.tog[aria-pressed="true"]{background:var(--chord);color:var(--surface);border-color:var(--chord)}
.song{padding:8px 20px 40px;font-size:var(--fs);line-height:1.35}
.part{position:relative;margin:22px 0 0;padding-left:30px}
.part .pn{position:absolute;left:0;top:0;color:var(--gold);font-size:.8em;font-weight:600}
.part.coro{border-left:3px solid var(--gold);padding-left:16px;margin-left:12px;font-style:italic}
.part.coro .pn{position:static;display:block;font-size:.72em;margin-bottom:2px;font-style:normal;letter-spacing:.04em}
.ln{margin:0 0 .35em}
.w{display:inline-block;white-space:nowrap;vertical-align:bottom}
.p{display:inline-flex;flex-direction:column;vertical-align:bottom}
.c{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-style:normal;font-weight:700;color:var(--chord);
  font-size:.78em;line-height:1.25;padding-right:.4em;min-height:1.25em;white-space:pre}
.t{display:block;min-height:1.35em;white-space:pre}
.p.gap .t::after{content:'-';color:var(--muted);padding-left:.12em}
.nochords .p.gap .t::after{content:none}
.nochords .c{display:none}
.nochords .ln{margin-bottom:.15em}
.nav{display:flex;justify-content:space-between;gap:12px;padding:10px 20px 40px}
.nav a{flex:1;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px}
.nav a.r{text-align:right}
.nav small{display:block;color:var(--muted);font-size:13px}
.foot{padding:20px;text-align:center;font-size:13px;color:var(--muted);font-style:italic}

.tog.edit[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1b1716}
.editing .ln{cursor:text;border-radius:6px;padding:2px 30px 2px 2px;position:relative}
.editing .ln:active{background:var(--surface)}
.editing .c:not(:empty){outline:1px dashed var(--chord);outline-offset:1px;border-radius:3px}
.editing .p{cursor:pointer}
.lnedit{position:absolute;right:0;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:18px;width:28px;height:28px;cursor:pointer}
.hint{margin:10px 20px 0;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:system-ui,sans-serif;font-size:14px;color:var(--muted);line-height:1.4}
.hint button{margin-top:8px}
.ed-mark{display:inline-block;margin-left:6px;font-size:12px;color:var(--gold);font-family:system-ui,sans-serif;font-style:normal}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));font-family:system-ui,sans-serif;max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .ctx{font-family:"Iowan Old Style",Georgia,serif;font-size:17px;margin:6px 0 12px;color:var(--muted)}
.sheet .ctx b{color:var(--chord)}
.sheet input,.sheet textarea{width:100%;font:inherit;font-size:20px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sheet textarea{font-size:16px;min-height:110px;font-family:ui-monospace,Menlo,monospace}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;color:var(--chord);cursor:pointer;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{flex:1;min-width:90px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:15px;cursor:pointer}
.row .pri{background:var(--wine);color:var(--wine-ink);border-color:var(--wine)}
.row .dan{color:#b3261e}
.small{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.4}
.menu{background:none;border:0;color:var(--wine-ink);font-size:22px;cursor:pointer;padding:0 4px}
</style>
</head>
<body>
<div id="app"></div>
<script src="hinos.js"></script>
<script>
(function(){
"use strict";
const HINOS = (window.HINOS||[]).slice().sort((a,b)=>a.n-b.n);
const byN = new Map(HINOS.map(h=>[h.n,h]));
const $app = document.getElementById('app');

/* ---------- preferências ---------- */
const PREF_KEY='cc-prefs';
let prefs={cifras:true,fs:19,tr:{}};
try{ Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY)||'{}')); }catch(e){}
function savePrefs(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }catch(e){} }
document.documentElement.style.setProperty('--fs', prefs.fs+'px');

/* ---------- utilidades ---------- */
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = l => l.replace(/\[[^\]]*\]/g,'').replace(/\s+/g,' ').trim();
const clean = l => strip(l).replace(/(\S)\s*-\s+(?=\S)/g,'$1').replace(/(\S)\s+-\s*(?=\S)/g,'$1').replace(/-(?=[\s,.;:!?]|$)/g,'');
const pad = n => String(n).padStart(3,'0');

/* ---------- transposição ---------- */
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const IDX={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,'E#':5,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11,'B#':0};
const FLAT_KEYS=new Set(['F','Bb','Eb','Ab','Db','Gb','Dm','Gm','Cm','Fm','Bbm','Ebm']);
function trNote(note, st, flats){ const i=IDX[note]; if(i===undefined) return note; return (flats?FL:SH)[(i+st+120)%12]; }
function trChord(ch, st, flats){
  if(!st) return ch;
  const pm=ch.match(/^\((.*)\)$/); if(pm) return '('+trChord(pm[1],st,flats)+')';
  return ch.split('/').map((part,k)=>{
    const m = part.match(/^([A-G][#b]?)(.*)$/);
    if(!m) return part;
    return trNote(m[1],st,flats)+(k===0?m[2]:'');
  }).join('/');
}
function keyInfo(h, st){
  const m=(h.tom||'C').match(/^([A-G][#b]?)(m?)/); if(!m) return {key:h.tom,flats:false};
  let flats;
  if(!st){ const k=m[1]+m[2]; flats = FLAT_KEYS.has(k) || /b/.test(m[1]); return {key:h.tom,flats}; }
  const tryS = trNote(m[1],st,false)+m[2], tryF = trNote(m[1],st,true)+m[2];
  flats = FLAT_KEYS.has(tryF);
  return {key: flats?tryF:tryS, flats};
}

/* ---------- linha com cifra: modelo ---------- */
function toModel(line){
  let text='', chords=[]; const re=/\[([^\]]*)\]/g; let last=0, m;
  while((m=re.exec(line))){ text+=line.slice(last,m.index); chords.push({pos:text.length,c:m[1]}); last=re.lastIndex; }
  text+=line.slice(last);
  return {text, chords};
}
function fromModel(md){
  const cs=md.chords.slice().sort((a,b)=>a.pos-b.pos); let out='', last=0;
  for(const ch of cs){ const p=Math.min(Math.max(ch.pos,0),md.text.length); out+=md.text.slice(last,p)+'['+ch.c+']'; last=p; }
  return out+md.text.slice(last);
}
function parseLine(line){ return toModel(line); }
function lineHTML(line, st, flats){
  const md=toModel(line); const T=md.text;
  const cuts=new Set([0,T.length]); md.chords.forEach(c=>cuts.add(c.pos));
  for(let i=0;i<T.length;i++){ if(/\s/.test(T[i])){ cuts.add(i); cuts.add(i+1); } }
  const pts=[...cuts].sort((x,y)=>x-y);
  const byPos=new Map(); md.chords.forEach((c,i)=>{ if(!byPos.has(c.pos)) byPos.set(c.pos,[]); byPos.get(c.pos).push(i); });
  const words=[]; let cur=[];
  const flush=()=>{ if(cur.length){ words.push(cur); cur=[]; } };
  for(let k=0;k<pts.length;k++){
    const a=pts[k], b=k+1<pts.length?pts[k+1]:a;
    const t=T.slice(a,b), space=!!t && /^\s+$/.test(t), idxs=byPos.get(a)||[];
    idxs.forEach((ci,j)=>{
      const c=trChord(md.chords[ci].c,st,flats);
      if(j===idxs.length-1 && t && !space) cur.push({c,ci,t,pos:a});
      else { flush(); words.push([{c,ci,t:'',pos:a}]); }
    });
    if(!idxs.length && t && !space) cur.push({c:null,ci:-1,t,pos:a});
    if(space) flush();
  }
  flush();
  return words.map(w=>'<span class="w">'+w.map(p=>'<span class="p" data-pos="'+p.pos+'" data-ci="'+p.ci+'"><span class="c">'+(p.c?esc(p.c):'')+'</span><span class="t">'+esc(p.t)+'</span></span>').join('')+'</span>').join(' ');
}

/* ---------- edições do usuário ---------- */
const ED_KEY='cc-edits';
let edits={};
try{ edits=JSON.parse(localStorage.getItem(ED_KEY)||'{}')||{}; }catch(e){ edits={}; }
function saveEdits(){ try{ localStorage.setItem(ED_KEY, JSON.stringify(edits)); }catch(e){ alert('Não foi possível salvar a edição neste aparelho.'); } }
function getLine(h,pi,li){ const e=edits[h.n]; const k=pi+'-'+li; return (e && k in e) ? e[k] : h.partes[pi].linhas[li]; }
function setLine(h,pi,li,val){
  const k=pi+'-'+li; const orig=h.partes[pi].linhas[li];
  if(!edits[h.n]) edits[h.n]={};
  if(val===orig) delete edits[h.n][k]; else edits[h.n][k]=val;
  if(!Object.keys(edits[h.n]).length) delete edits[h.n];
  saveEdits(); rebuildIndex();
}
const isEdited = n => !!edits[n];
function hymnChords(h){ const s=new Set(); h.partes.forEach((p,pi)=>p.linhas.forEach((l,li)=>toModel(getLine(h,pi,li)).chords.forEach(c=>s.add(c.c)))); return [...s]; }

/* ---------- busca ---------- */
let INDEX=[];
function rebuildIndex(){ INDEX = HINOS.map(h=>({h, t:norm(h.titulo), l:norm(h.partes.map((p,pi)=>p.linhas.map((l,li)=>{const x=strip(getLine(h,pi,li));return x+' '+clean(x);}).join(' ')).join(' '))})); }
rebuildIndex();
function search(q){
  const nq=norm(q);
  if(!nq) return {titulo:HINOS, letra:[]};
  if(/^\d+$/.test(nq)){
    const n=+nq;
    const res=HINOS.filter(h=>String(h.n).startsWith(String(n)));
    res.sort((a,b)=>(a.n===n?-1:b.n===n?1:a.n-b.n));
    return {titulo:res, letra:[]};
  }
  const terms=nq.split(' ');
  const titulo=INDEX.filter(x=>terms.every(t=>x.t.includes(t))).map(x=>x.h);
  const tset=new Set(titulo);
  const letra=INDEX.filter(x=>!tset.has(x.h) && terms.every(t=>x.l.includes(t))).map(x=>x.h);
  return {titulo, letra};
}

/* ---------- telas ---------- */
let lastQuery='';
let editMode=false;
function viewList(){
  document.title='Cantor Cristão Cifrado';
  $app.innerHTML=`
  <header class="top">
    <div class="brand"><h1>Cantor Cristão</h1><span>${HINOS.length} hinos cifrados <button class="menu" id="bk" aria-label="Minhas edições">⋯</button></span></div>
    <label class="search"><input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Número ou título do hino" aria-label="Buscar hino por número ou título" value="${esc(lastQuery)}"><button class="clear" id="clr" aria-label="Limpar busca">×</button></label>
  </header>
  <main><div id="res"></div><p class="foot">Uso pessoal · Conteúdo do Cantor Cristão Cifrado</p></main>`;
  const q=document.getElementById('q');
  const draw=()=>{
    lastQuery=q.value; const r=search(q.value);
    const item=h=>`<li><a href="#/hino/${h.n}"><span class="num">${h.n}</span><span><span class="tt">${esc(h.titulo)}${isEdited(h.n)?'<span class="ed-mark">editado</span>':''}</span><span class="fl">${esc(clean(getLine(h,0,0)))}</span></span></a></li>`;
    let html='';
    if(r.titulo.length) html+='<ul class="list">'+r.titulo.map(item).join('')+'</ul>';
    if(r.letra.length) html+='<p class="sec">Encontrado na letra</p><ul class="list">'+r.letra.map(item).join('')+'</ul>';
    if(!html) html='<p class="empty">Nenhum hino encontrado.</p>';
    document.getElementById('res').innerHTML=html;
  };
  q.addEventListener('input',draw);
  q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const r=search(q.value); const f=r.titulo[0]||r.letra[0]; if(f) location.hash='#/hino/'+f.n; }});
  document.getElementById('bk').onclick=e=>{ e.preventDefault(); openBackupSheet(); };
  document.getElementById('clr').onclick=e=>{ e.preventDefault(); q.value=''; draw(); q.focus(); };
  draw();
}

function viewHino(n){
  const h=byN.get(n); if(!h){ location.hash=''; return; }
  document.title=h.n+' · '+h.titulo;
  const st=prefs.tr[n]||0; const {key,flats}=keyInfo(h,st);
  let ei=0;
  const partes=h.partes.map((p,pi)=>{
    const lab = p.tipo==='coro' ? 'Coro' : String(++ei);
    return `<section class="part ${p.tipo}"><span class="pn">${lab}</span>${p.linhas.map((l,li)=>'<p class="ln" data-pi="'+pi+'" data-li="'+li+'">'+lineHTML(getLine(h,pi,li),st,flats)+(editMode?'<button class="lnedit" aria-label="Editar linha inteira">✎</button>':'')+'</p>').join('')}</section>`;
  }).join('');
  const i=HINOS.indexOf(h), prev=HINOS[i-1], next=HINOS[i+1];
  $app.innerHTML=`
  <div class="hbar">
    <button class="ib" id="back" aria-label="Voltar para a lista">‹ Hinos</button>
    <span class="sp"></span>
    <button class="ib" id="fsm" aria-label="Diminuir letra">A−</button>
    <button class="ib" id="fsp" aria-label="Aumentar letra">A+</button>
  </div>
  <main>
    <div class="head">
      <div class="n">${h.n}</div>
      <h2>${esc(h.titulo)}${isEdited(n)?'<span class="ed-mark">editado</span>':''}</h2>
      <div class="meta"><span>Tom <b>${esc(key)}</b>${st?` (original ${esc(h.tom)})`:''}</span>${h.ritmo?`<span>Ritmo <b>${esc(h.ritmo)}</b></span>`:''}</div>
      ${h.creditos&&h.creditos.length?`<p class="cred">${h.creditos.map(esc).join('<br>')}</p>`:''}
    </div>
    <div class="tools">
      <button class="tog" id="tc" aria-pressed="${prefs.cifras}">Cifras</button>
      <span class="chip" ${prefs.cifras?'':'hidden'}><button id="trm" aria-label="Baixar meio tom">−</button><span class="lbl">Tom <b>${esc(key)}</b></span><button id="trp" aria-label="Subir meio tom">+</button></span>
      ${st?'<button class="tog" id="trr">Tom original</button>':''}
      <button class="tog edit" id="ted" aria-pressed="${editMode}">${editMode?'Concluir edição':'Editar cifras'}</button>
    </div>
    ${editMode?`<div class="hint">Toque numa sílaba para pôr ou trocar o acorde. Toque em ✎ para editar a linha inteira. As mudanças ficam salvas neste aparelho.${isEdited(n)?'<br><button class="tog" id="rst">Restaurar cifras originais deste hino</button>':''}</div>`:''}
    <div class="song ${prefs.cifras||editMode?'':'nochords'} ${editMode?'editing':''}">${partes}</div>
    <nav class="nav">${prev?`<a href="#/hino/${prev.n}"><small>Anterior</small>${prev.n} · ${esc(prev.titulo)}</a>`:'<span></span>'}${next?`<a class="r" href="#/hino/${next.n}"><small>Próximo</small>${next.n} · ${esc(next.titulo)}</a>`:'<span></span>'}</nav>
  </main>`;
  fixGaps();
  document.getElementById('back').onclick=()=>{ location.hash=''; };
  const setFs=d=>{ prefs.fs=Math.min(34,Math.max(14,prefs.fs+d)); document.documentElement.style.setProperty('--fs',prefs.fs+'px'); savePrefs(); fixGaps(); };
  document.getElementById('fsm').onclick=()=>setFs(-2);
  document.getElementById('fsp').onclick=()=>setFs(2);
  document.getElementById('tc').onclick=()=>{ prefs.cifras=!prefs.cifras; savePrefs(); viewHino(n); };
  const setTr=v=>{ v=((v%12)+12)%12; if(v>6) v-=12; if(v) prefs.tr[n]=v; else delete prefs.tr[n]; savePrefs(); const y=scrollY; viewHino(n); scrollTo(0,y); };
  const bm=document.getElementById('trm'), bp=document.getElementById('trp'), br=document.getElementById('trr');
  if(bm) bm.onclick=()=>setTr(st-1);
  if(bp) bp.onclick=()=>setTr(st+1);
  if(br) br.onclick=()=>setTr(0);
  const redraw=()=>{ const y=scrollY; viewHino(n); scrollTo(0,y); };
  document.getElementById('ted').onclick=()=>{ editMode=!editMode; redraw(); };
  const rst=document.getElementById('rst');
  if(rst) rst.onclick=()=>{ if(confirm('Apagar todas as suas edições deste hino e voltar às cifras do livro?')){ delete edits[n]; saveEdits(); rebuildIndex(); redraw(); } };
  if(!editMode) return;
  const song=document.querySelector('.song');
  song.addEventListener('click',e=>{
    const ln=e.target.closest('.ln'); if(!ln) return;
    const pi=+ln.dataset.pi, li=+ln.dataset.li;
    if(e.target.closest('.lnedit')){ openLineSheet(h,pi,li,redraw); return; }
    const pc=e.target.closest('.p'); if(!pc) return;
    let pos=+pc.dataset.pos, ci=+pc.dataset.ci;
    // posição exata da letra tocada
    if(e.target.closest('.t')){
      let off=null;
      if(document.caretRangeFromPoint){ const r=document.caretRangeFromPoint(e.clientX,e.clientY); if(r && pc.querySelector('.t').contains(r.startContainer)) off=r.startOffset; }
      else if(document.caretPositionFromPoint){ const r=document.caretPositionFromPoint(e.clientX,e.clientY); if(r && pc.querySelector('.t').contains(r.offsetNode)) off=r.offset; }
      if(off!==null && off>0 && off<pc.querySelector('.t').textContent.length){ pos+=off; ci=-1; }
    }
    openChordSheet(h,pi,li,pos,ci,st,flats,redraw);
  });
}

function fixGaps(){
  document.querySelectorAll('.song .w').forEach(w=>{
    const ps=w.querySelectorAll('.p');
    ps.forEach((p,i)=>{ p.classList.remove('gap'); if(i<ps.length-1){ const t=p.querySelector('.t'); if(t.firstChild){ const r=document.createRange(); r.selectNodeContents(t); if(p.getBoundingClientRect().width - r.getBoundingClientRect().width > 6) p.classList.add('gap'); } } });
  });
}
addEventListener('resize',()=>fixGaps());
/* ---------- folhas de edição ---------- */
function sheet(html){
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener('click',e=>{ if(e.target===bg) close(); });
  return {el:bg.firstChild, close};
}
function cleanChord(v){ return v.replace(/[\[\]]/g,'').replace(/\s+/g,'').trim(); }
function openChordSheet(h,pi,li,pos,ci,st,flats,done){
  const line=getLine(h,pi,li), md=toModel(line);
  let idx = ci>=0 ? ci : md.chords.findIndex(c=>c.pos===pos);
  const cur = idx>=0 ? md.chords[idx] : null;
  if(cur) pos=cur.pos;
  const shown = cur ? trChord(cur.c,st,flats) : '';
  const T=md.text; const wS=T.lastIndexOf(' ',pos-1)+1; let wE=T.indexOf(' ',pos); if(wE<0) wE=T.length;
  const ctx=esc(T.slice(Math.max(0,wS-12),pos))+'<b>▾</b>'+esc(T.slice(pos,Math.min(T.length,wE+12)));
  const chips=hymnChords(h).map(c=>trChord(c,st,flats)).filter((v,i,a)=>a.indexOf(v)===i);
  const {el,close}=sheet(`<h3>${cur?'Trocar acorde':'Novo acorde'}</h3><div class="ctx">…${ctx}…</div>
    <input id="chv" value="${esc(shown)}" placeholder="Ex.: G, D7, Am, C/E" autocapitalize="characters" autocomplete="off" spellcheck="false">
    <div class="chips">${chips.map(c=>`<button data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    ${cur?'<div class="row"><button id="mvl">◀ Mover</button><button id="mvr">Mover ▶</button></div>':''}
    <div class="row">${cur?'<button class="dan" id="del">Remover</button>':''}<button id="cnl">Cancelar</button><button class="pri" id="ok">Salvar</button></div>
    ${st?'<p class="small">O hino está transposto. Digite o acorde como quer ver neste tom; ele é guardado já convertido para o tom original.</p>':''}`);
  const inp=el.querySelector('#chv'); setTimeout(()=>inp.focus(),50);
  el.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{ inp.value=b.dataset.c; inp.focus(); });
  const commit=()=>{ setLine(h,pi,li,fromModel(md)); close(); done(); };
  el.querySelector('#cnl').onclick=close;
  el.querySelector('#ok').onclick=()=>{
    const v=cleanChord(inp.value);
    if(!v){ if(cur){ md.chords.splice(idx,1); commit(); } else close(); return; }
    const orig=trChord(v,-st,keyInfo(h,0).flats);
    if(cur) cur.c=orig; else md.chords.push({pos,c:orig});
    commit();
  };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') el.querySelector('#ok').click(); });
  if(cur){
    el.querySelector('#del').onclick=()=>{ md.chords.splice(idx,1); commit(); };
    const mv=d=>{ let p=cur.pos+d; while(p>0 && p<T.length && /\s/.test(T[p]) && /\s/.test(T[p-1])) p+=d; cur.pos=Math.max(0,Math.min(T.length,p)); commit(); };
    el.querySelector('#mvl').onclick=()=>mv(-1);
    el.querySelector('#mvr').onclick=()=>mv(1);
  }
}
function openLineSheet(h,pi,li,done){
  const line=getLine(h,pi,li), orig=h.partes[pi].linhas[li];
  const {el,close}=sheet(`<h3>Editar linha</h3><p class="small">Escreva cada acorde entre colchetes logo antes da sílaba: <b>[G]Ó gratos [D7]ao Se[G]nhor</b>. Os acordes ficam no tom original do hino.</p>
    <textarea id="lnv" spellcheck="false">${esc(line)}</textarea>
    <div class="row">${line!==orig?'<button id="und">Voltar ao original</button>':''}<button id="cnl">Cancelar</button><button class="pri" id="ok">Salvar</button></div>`);
  const ta=el.querySelector('#lnv');
  el.querySelector('#cnl').onclick=close;
  el.querySelector('#ok').onclick=()=>{
    const v=ta.value.replace(/\n+/g,' ');
    if((v.match(/\[/g)||[]).length!==(v.match(/\]/g)||[]).length){ alert('Confira os colchetes: cada [ precisa de um ].'); return; }
    setLine(h,pi,li,v); close(); done();
  };
  const u=el.querySelector('#und'); if(u) u.onclick=()=>{ setLine(h,pi,li,orig); close(); done(); };
}

/* ---------- cópia de segurança das edições ---------- */
function openBackupSheet(){
  const qtd=Object.keys(edits).length;
  const {el,close}=sheet(`<h3>Minhas edições</h3><p class="small">${qtd?`Você editou ${qtd} hino${qtd>1?'s':''}.`:'Nenhum hino editado ainda.'} As edições ficam só neste aparelho. Exporte uma cópia para não perder ao trocar de celular ou limpar o navegador, ou para passar a outra pessoa.</p>
    <div class="row"><button id="exp" ${qtd?'':'disabled'}>Exportar cópia</button><button id="imp">Importar cópia</button></div>
    <input type="file" id="fil" accept=".json,application/json" hidden>
    <div class="row"><button id="cnl">Fechar</button></div>`);
  el.querySelector('#cnl').onclick=close;
  el.querySelector('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify({app:'cantor-cristao',versao:1,edicoes:edits},null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='cantor-cristao-edicoes.json'; document.body.appendChild(a); a.click(); a.remove();
  };
  const fil=el.querySelector('#fil');
  el.querySelector('#imp').onclick=()=>fil.click();
  fil.onchange=()=>{
    const f=fil.files[0]; if(!f) return;
    f.text().then(t=>{
      let d; try{ d=JSON.parse(t); }catch(e){ alert('Arquivo inválido.'); return; }
      const e=d&&d.edicoes; if(!e||typeof e!=='object'){ alert('Este arquivo não é uma cópia de edições do app.'); return; }
      let k=0; for(const n of Object.keys(e)){ if(byN.has(+n) && typeof e[n]==='object'){ edits[n]=Object.assign(edits[n]||{},e[n]); k++; } }
      saveEdits(); rebuildIndex(); close(); alert(k+' hino(s) importado(s).'); route();
    });
  };
}

function route(){
  const m=location.hash.match(/^#\/hino\/(\d+)/);
  if(m){ if(+m[1]!==route.last) editMode=false; route.last=+m[1]; viewHino(+m[1]); scrollTo(0,0); } else { editMode=false; route.last=null; viewList(); }
}
addEventListener('hashchange',route);
route();

/* exposto para testes */
window.__cc={toModel,fromModel,getLine,parseLine,lineHTML,trChord,keyInfo,search,norm,strip};

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
